r-color:#2a1040;cursor:default;transform:scale(1);box-shadow:inset 0 0 8px #00000080;}.cell.clicked:hover{transform:scale(1);box-shadow:inset 0 0 8px #00000080;}.jumpscare{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:9999;justify-content:center;align-items:center;}.jumpscare img{max-width:90vw;max-height:90vh;object-fit:contain;}@keyframes shake{0%,100%{transform:translate(0,0) rotate(0deg);}10%{transform:translate(-10px,-8px) rotate(-1deg);}20%{transform:translate(10px,8px) rotate(1deg);}30%{transform:translate(-10px,8px) rotate(-1deg);}40%{transform:translate(10px,-8px) rotate(1deg);}50%{transform:translate(-7px,7px) rotate(-0.5deg);}60%{transform:translate(7px,-7px) rotate(0.5deg);}70%{transform:translate(-4px,4px);}80%{transform:translate(4px,-4px);}90%{transform:translate(-2px,2px);}}body.shake{animation:shake 0.6s ease-in-out;}</style>
